<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="5;url=https://alunapp.cn" />
  <title>AlunApp 已迁移</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f8fa;
      color: #1f2937;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: white;
      padding: 40px 28px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      max-width: 520px;
      width: 90%;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 16px;
    }
    p {
      font-size: 16px;
      line-height: 1.7;
      color: #4b5563;
    }
    a {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 22px;
      border-radius: 999px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      font-weight: 600;
    }
    .small {
      margin-top: 18px;
      font-size: 13px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>AlunApp 已迁移到新域名</h1>
    <p>
      原域名 <strong>alunapp.asia</strong> 已停止作为主访问地址。<br>
      请使用新的官方网站：
    </p>
    <a href="https://alunapp.cn">访问 alunapp.cn</a>
    <p class="small">页面将在 5 秒后自动跳转到新域名。</p>
  </div>
</body>
</html>
