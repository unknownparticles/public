<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AlunApp 已迁移</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f7f8fa;
      color: #1f2937;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }

    .card {
      width: 100%;
      max-width: 520px;
      padding: 40px 28px;
      border-radius: 20px;
      background: #ffffff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
    }

    h1 {
      margin: 0 0 16px;
      font-size: 28px;
      line-height: 1.3;
    }

    p {
      margin: 0;
      color: #4b5563;
      font-size: 16px;
      line-height: 1.7;
    }

    .button {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 22px;
      border-radius: 999px;
      background: #2563eb;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
    }

    .small {
      margin-top: 18px;
      font-size: 13px;
      color: #9ca3af;
    }

    .target {
      margin-top: 12px;
      font-size: 13px;
      color: #9ca3af;
      word-break: break-all;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>AlunApp 已迁移到新域名</h1>

    <p>
      原域名 <strong>alunapp.asia</strong> 已停止作为主访问地址。<br />
      请使用新的官方网站：
    </p>

    <a id="new-link" class="button" href="https://alunapp.cn">
      访问 alunapp.cn
    </a>

    <p class="small">
      页面将在 <span id="countdown">5</span> 秒后自动跳转到对应的新地址。
    </p>

    <div id="target-url" class="target"></div>
  </div>

  <script>
    const target =
      "https://alunapp.cn" +
      window.location.pathname +
      window.location.search +
      window.location.hash;

    const link = document.getElementById("new-link");
    const targetUrl = document.getElementById("target-url");
    const countdown = document.getElementById("countdown");

    link.href = target;
    targetUrl.textContent = target;

    let seconds = 5;

    const timer = setInterval(() => {
      seconds -= 1;
      countdown.textContent = seconds;

      if (seconds <= 0) {
        clearInterval(timer);
        window.location.replace(target);
      }
    }, 1000);
  </script>
</body>
</html>
