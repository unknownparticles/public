<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AlunApp 已迁移</title>

  <script>
    const target =
      "https://alunapp.cn" +
      window.location.pathname +
      window.location.search +
      window.location.hash;

    setTimeout(() => {
      window.location.replace(target);
    }, 1800);
    const oldUrl =
      "https://alunapp.asia" +
      window.location.pathname +
      window.location.search +
      window.location.hash;

    const newUrl = target;

    document.getElementById("message").innerHTML = `
      <strong>${oldUrl}</strong><br />
      已迁移至<br />
      <strong>${newUrl}</strong>
  `;
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      color: #111111;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    .label {
      font-size: 13px;
      color: #888;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: clamp(36px, 7vw, 56px);
      line-height: 1.02;
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .domain {
      color: #666;
      font-weight: 500;
    }

    p {
      margin-top: 24px;
      color: #555;
      font-size: 16px;
      line-height: 1.8;
    }

    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 32px;
      padding: 14px 22px;
      border-radius: 999px;
      background: #111;
      color: white;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      transition: opacity .2s ease;
    }

    a.button:hover {
      opacity: .82;
    }

    .path {
      margin-top: 18px;
      font-size: 13px;
      color: #999;
      word-break: break-all;
    }

    .footer {
      margin-top: 14px;
      font-size: 13px;
      color: #aaa;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="label">
      Domain Migration
    </div>

    <h1>
      AlunApp<br />
      <span class="domain">已迁移至 alunapp.cn</span>
    </h1>

    <p id="message"></p>

    <a
      class="button"
      id="link"
      href="https://alunapp.cn"
    >
      前往新网站
    </a>

    <div class="path" id="path"></div>

    <div class="footer">
      页面将在约 2 秒后自动跳转
    </div>
  </main>

  <script>
    document.getElementById("link").href = target;
    document.getElementById("path").textContent = target;
  </script>
</body>
</html>
