<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AlunApp 已迁移</title>
  <script>
    const target =
      "https://alunapp.cn" +
      window.location.pathname +
      window.location.search +
      window.location.hash;

    setTimeout(() => {
      window.location.replace(target);
    }, 1000);
  </script>
</head>
<body>
  <main style="font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px;">
    <div>
      <h1>AlunApp 已迁移到新域名</h1>
      <p>正在跳转到对应的新地址：</p>
      <p><a id="link" href="https://alunapp.cn">https://alunapp.cn</a></p>
    </div>
  </main>

  <script>
    const link = document.getElementById("link");
    link.href = target;
    link.textContent = target;
  </script>
</body>
</html>
