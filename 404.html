<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AlunApp 已迁移</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #ffffff;
      color: #111111;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .container {
      width: 100%;
      max-width: 560px;
    }

    .label {
      font-size: 13px;
      color: #888;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: clamp(38px, 7vw, 58px);
      line-height: 1.02;
      letter-spacing: -0.05em;
      font-weight: 700;
    }

    .domain {
      color: #666;
      font-weight: 500;
    }

    p {
      margin-top: 28px;
      color: #444;
      font-size: 16px;
      line-height: 1.9;
      word-break: break-word;
    }

    strong {
      color: #111;
      font-weight: 600;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 34px;
      padding: 14px 24px;
      border-radius: 999px;
      background: #111111;
      color: white;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      transition: opacity .2s ease;
    }

    .button:hover {
      opacity: .82;
    }

    .footer {
      margin-top: 18px;
      font-size: 13px;
      color: #999;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="label">
      Domain Migration
    </div>

    <h1 id="title"></h1>

    <p id="message"></p>

    <a
      class="button"
      id="link"
      href="https://alunapp.cn"
    >
      前往新网站
    </a>

    <div class="footer">
      页面将在 <span id="countdown">2</span> 秒后自动跳转
    </div>
  </main>

  <script>
    const target =
      "https://alunapp.cn" +
      window.location.pathname +
      window.location.search +
      window.location.hash;

    const oldUrl =
      "https://alunapp.asia" +
      window.location.pathname +
      window.location.search +
      window.location.hash;

    document.getElementById("link").href = target;

    document.getElementById("message").innerHTML = `
      即将前往<strong>${target}</strong>
    `;

    let seconds = 2;

    const countdown = document.getElementById("countdown");

    const timer = setInterval(() => {
      seconds -= 1;
      countdown.textContent = seconds;

      if (seconds <= 0) {
        clearInterval(timer);
        window.location.replace(target);
      }
    }, 1000);
    document.getElementById("title").innerHTML = `
    AlunApp<br />
    <span class="domain">
      已迁移至 ${target}
    </span>
    `;
  </script>
</body>
</html>
